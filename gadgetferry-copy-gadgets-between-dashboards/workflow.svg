<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="720" height="120" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5E52"/>
    </marker>
  </defs>
  <rect width="720" height="120" fill="#FAF7F2"/>

  <rect x="6" y="6" width="214" height="108" rx="12" fill="#FFFFFF" stroke="#E6DED3"/>
  <text x="113" y="33" text-anchor="middle" font-size="17" font-weight="600" fill="#7A4E14">1. Choose</text>
  <text x="113" y="60" text-anchor="middle" font-size="15" fill="#2B2118">a gadget on a dashboard</text>
  <text x="113" y="81" text-anchor="middle" font-size="15" fill="#2B2118">you can view</text>
  <text x="113" y="103" text-anchor="middle" font-size="13.5" fill="#5A4E43">its settings are listed by name</text>

  <line x1="224" y1="60" x2="250" y2="60" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="253" y="6" width="214" height="108" rx="12" fill="#2B2118"/>
  <text x="360" y="33" text-anchor="middle" font-size="17" font-weight="600" fill="#F2C98E">2. Copy</text>
  <text x="360" y="60" text-anchor="middle" font-size="15" fill="#FAF7F2">to up to 20 dashboards</text>
  <text x="360" y="81" text-anchor="middle" font-size="15" fill="#FAF7F2">you can edit</text>
  <text x="360" y="103" text-anchor="middle" font-size="13.5" fill="#E6DED3">the gadgets there stay</text>

  <line x1="471" y1="60" x2="497" y2="60" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="6" width="214" height="108" rx="12" fill="#FFFFFF" stroke="#C8842B" stroke-width="2"/>
  <text x="607" y="33" text-anchor="middle" font-size="17" font-weight="600" fill="#7A4E14">3. Check or undo</text>
  <text x="607" y="60" text-anchor="middle" font-size="15" fill="#2B2118">each setting Matched</text>
  <text x="607" y="81" text-anchor="middle" font-size="15" fill="#2B2118">or Not copied, with why</text>
  <text x="607" y="103" text-anchor="middle" font-size="13.5" fill="#5A4E43">Undo this copy</text>
</svg>
