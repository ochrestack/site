<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5E52"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#FAF7F2"/>

  <!-- Step 1: pick the gadget -->
  <rect x="8" y="40" width="208" height="200" rx="12" fill="#FFFFFF" stroke="#E6DED3"/>
  <text x="112" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2118">You pick a gadget</text>
  <text x="112" y="108" text-anchor="middle" font-size="15" fill="#5A4E43">a dashboard you can view</text>
  <text x="112" y="132" text-anchor="middle" font-size="15" fill="#5A4E43">title, type, column, row</text>
  <text x="112" y="156" text-anchor="middle" font-size="15" fill="#5A4E43">settings listed by name</text>
  <text x="112" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">1. Choose the gadget</text>

  <line x1="220" y1="140" x2="250" y2="140" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: targets -->
  <rect x="254" y="40" width="208" height="200" rx="12" fill="#2B2118"/>
  <text x="358" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#FAF7F2">Gadgetferry adds it</text>
  <text x="358" y="104" text-anchor="middle" font-size="15" fill="#E6DED3">to up to 20 dashboards</text>
  <text x="358" y="126" text-anchor="middle" font-size="15" fill="#E6DED3">you can edit, in the</text>
  <text x="358" y="148" text-anchor="middle" font-size="15" fill="#E6DED3">column you choose; the</text>
  <text x="358" y="170" text-anchor="middle" font-size="15" fill="#E6DED3">gadgets there stay</text>
  <text x="358" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#F2C98E">2. Copy gadget</text>

  <line x1="466" y1="140" x2="496" y2="140" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: read back -->
  <rect x="500" y="40" width="212" height="200" rx="12" fill="#FFFFFF" stroke="#C8842B" stroke-width="2"/>
  <text x="606" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2118">Then it reads it back</text>
  <g font-size="13.5" fill="#2B2118">
    <rect x="512" y="88" width="188" height="24" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="606" y="105" text-anchor="middle">each setting: Matched</text>
    <rect x="512" y="116" width="188" height="24" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="606" y="133" text-anchor="middle">or Not copied, with why</text>
    <rect x="512" y="144" width="188" height="24" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="606" y="161" text-anchor="middle">Undo this copy</text>
  </g>
  <text x="606" y="190" text-anchor="middle" font-size="15" fill="#5A4E43">open the copy to check</text>
  <text x="606" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">3. Check, or undo</text>

  <text x="360" y="284" text-anchor="middle" font-size="15" fill="#5A4E43">From Apps &gt; Gadgetferry, with your own Jira permissions.</text>
  <text x="360" y="306" text-anchor="middle" font-size="15" fill="#5A4E43">Nothing leaves Atlassian.</text>
</svg>
