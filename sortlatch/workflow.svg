<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>How Sortlatch works: preview the new order of a page's child pages, keep it sorted as pages are added, renamed or moved in, and check or undo every rule from the space overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5E52"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#FAF7F2"/>

  <!-- Step 1: the dialog and its preview -->
  <rect x="8" y="40" width="208" height="200" rx="12" fill="#FFFFFF" stroke="#E6DED3"/>
  <text x="112" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2118">Sort child pages</text>
  <text x="112" y="108" text-anchor="middle" font-size="15" fill="#5A4E43">from a page's ••• menu</text>
  <text x="112" y="132" text-anchor="middle" font-size="15" fill="#5A4E43">A→Z, Z→A, by date</text>
  <text x="112" y="156" text-anchor="middle" font-size="15" fill="#5A4E43">pins, one level or all</text>
  <text x="112" y="180" text-anchor="middle" font-size="15" fill="#5A4E43">each move marked</text>
  <text x="112" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">1. Preview, then sort</text>

  <line x1="220" y1="140" x2="250" y2="140" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: keep sorted -->
  <rect x="254" y="40" width="208" height="200" rx="12" fill="#2B2118"/>
  <text x="358" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#FAF7F2">Kept sorted</text>
  <text x="358" y="108" text-anchor="middle" font-size="15" fill="#E6DED3">new, renamed, moved-in</text>
  <text x="358" y="132" text-anchor="middle" font-size="15" fill="#E6DED3">and copied-in pages,</text>
  <text x="358" y="156" text-anchor="middle" font-size="15" fill="#E6DED3">and manual drags, go</text>
  <text x="358" y="180" text-anchor="middle" font-size="15" fill="#E6DED3">back in order in minutes</text>
  <text x="358" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#F2C98E">2. Keep sorted</text>

  <line x1="466" y1="140" x2="496" y2="140" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: the space overview -->
  <rect x="500" y="40" width="212" height="200" rx="12" fill="#FFFFFF" stroke="#C8842B" stroke-width="2"/>
  <text x="606" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2118">Space overview</text>
  <text x="606" y="108" text-anchor="middle" font-size="15" fill="#5A4E43">every rule, its last run</text>
  <text x="606" y="132" text-anchor="middle" font-size="15" fill="#5A4E43">why a level was skipped</text>
  <text x="606" y="156" text-anchor="middle" font-size="15" fill="#5A4E43">Undo last sort or</text>
  <text x="606" y="180" text-anchor="middle" font-size="15" fill="#5A4E43">Restore original order</text>
  <text x="606" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">3. Check or undo</text>

  <text x="360" y="284" text-anchor="middle" font-size="15" fill="#5A4E43">Pages never change parent and content is never edited. A daily check</text>
  <text x="360" y="306" text-anchor="middle" font-size="15" fill="#5A4E43">puts back anything missed. Folders and the top level are not sorted.</text>
</svg>
