<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5E52"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#FAF7F2"/>

  <!-- Step 1: your rig -->
  <rect x="8" y="40" width="208" height="200" rx="12" fill="#FFFFFF" stroke="#E6DED3"/>
  <text x="112" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2118">Your rig, untouched</text>
  <text x="112" y="108" text-anchor="middle" font-size="15" fill="#5A4E43">IK, constraints, drivers</text>
  <text x="112" y="132" text-anchor="middle" font-size="15" fill="#5A4E43">control rig or NLA clips</text>
  <text x="112" y="156" text-anchor="middle" font-size="15" fill="#5A4E43">original actions kept</text>
  <text x="112" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">1. Validate Rig for Export</text>

  <line x1="220" y1="140" x2="250" y2="140" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: bake -->
  <rect x="254" y="40" width="208" height="200" rx="12" fill="#2B2118"/>
  <text x="358" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#FAF7F2">Baked for you</text>
  <text x="358" y="108" text-anchor="middle" font-size="15" fill="#E6DED3">from the rest pose</text>
  <text x="358" y="132" text-anchor="middle" font-size="15" fill="#E6DED3">one baked action per clip</text>
  <text x="358" y="156" text-anchor="middle" font-size="15" fill="#E6DED3">plain keys, no constraints</text>
  <text x="358" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#F2C98E">part of Export Game-Ready</text>

  <line x1="466" y1="140" x2="496" y2="140" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: export -->
  <rect x="500" y="40" width="212" height="200" rx="12" fill="#FFFFFF" stroke="#C8842B" stroke-width="2"/>
  <text x="606" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2118">One clip per action</text>
  <g font-size="15" fill="#2B2118">
    <rect x="514" y="92" width="58" height="28" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="543" y="111" text-anchor="middle">Godot</text>
    <rect x="577" y="92" width="58" height="28" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="606" y="111" text-anchor="middle">Unity</text>
    <rect x="640" y="92" width="58" height="28" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="669" y="111" text-anchor="middle">Unreal</text>
  </g>
  <text x="606" y="148" text-anchor="middle" font-size="15" fill="#5A4E43">glTF or FBX</text>
  <text x="606" y="172" text-anchor="middle" font-size="15" fill="#5A4E43">documented settings</text>
  <text x="606" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">2. Export Game-Ready</text>

  <text x="360" y="284" text-anchor="middle" font-size="15" fill="#5A4E43">Two clicks in one sidebar tab. Presets are editable</text>
  <text x="360" y="306" text-anchor="middle" font-size="15" fill="#5A4E43">and saved with your .blend file.</text>
</svg>
