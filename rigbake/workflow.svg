<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5E52"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#FAF7F2"/>

  <!-- Step 1: your rig -->
  <rect x="20" y="70" width="230" height="150" rx="12" fill="#FFFFFF" stroke="#E6DED3"/>
  <text x="135" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2118">Your rig, untouched</text>
  <text x="135" y="128" text-anchor="middle" font-size="13" fill="#6B5E52">IK, constraints, drivers</text>
  <text x="135" y="148" text-anchor="middle" font-size="13" fill="#6B5E52">control rig or NLA clips</text>
  <text x="135" y="168" text-anchor="middle" font-size="13" fill="#6B5E52">original actions kept</text>
  <text x="135" y="200" text-anchor="middle" font-size="12" fill="#C8842B">1. Validate Rig for Export</text>

  <line x1="254" y1="145" x2="306" y2="145" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: bake -->
  <rect x="310" y="70" width="240" height="150" rx="12" fill="#2B2118"/>
  <text x="430" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FAF7F2">Baked for you</text>
  <text x="430" y="128" text-anchor="middle" font-size="13" fill="#E6DED3">from the rest pose</text>
  <text x="430" y="148" text-anchor="middle" font-size="13" fill="#E6DED3">one baked action per clip</text>
  <text x="430" y="168" text-anchor="middle" font-size="13" fill="#E6DED3">plain keys, no constraints</text>
  <text x="430" y="200" text-anchor="middle" font-size="12" fill="#C8842B">part of Export Game-Ready</text>

  <line x1="554" y1="145" x2="586" y2="145" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: export -->
  <rect x="590" y="70" width="270" height="150" rx="12" fill="#FFFFFF" stroke="#C8842B" stroke-width="2"/>
  <text x="725" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#2B2118">One clean clip per action</text>
  <g font-size="13" fill="#2B2118">
    <rect x="611" y="116" width="72" height="26" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="647" y="134" text-anchor="middle">Godot</text>
    <rect x="689" y="116" width="72" height="26" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="725" y="134" text-anchor="middle">Unity</text>
    <rect x="767" y="116" width="72" height="26" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="803" y="134" text-anchor="middle">Unreal</text>
  </g>
  <text x="725" y="168" text-anchor="middle" font-size="13" fill="#6B5E52">glTF or FBX, documented settings</text>
  <text x="725" y="200" text-anchor="middle" font-size="12" fill="#C8842B">2. Export Game-Ready</text>

  <text x="440" y="262" text-anchor="middle" font-size="13" fill="#6B5E52">Two clicks in one sidebar tab. Presets are editable and saved with your .blend file.</text>
</svg>
