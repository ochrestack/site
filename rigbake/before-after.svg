<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="470" fill="#FAF7F2"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#2B2118">Two measured cases, Blender 4.2 / 4.5 / 5.0</text>

  <!-- column headers -->
  <text x="300" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#5A4E43">Plain export, defaults</text>
  <text x="570" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">Rigbake</text>

  <!-- case 1 -->
  <text x="8" y="116" font-size="16" font-weight="600" fill="#2B2118">Control rig</text>
  <text x="8" y="140" font-size="14" fill="#5A4E43">deform rig driven</text>
  <text x="8" y="160" font-size="14" fill="#5A4E43">by a control rig,</text>
  <text x="8" y="180" font-size="14" fill="#5A4E43">exported alone</text>

  <rect x="180" y="90" width="240" height="112" rx="10" fill="#FFFFFF" stroke="#E6DED3"/>
  <text x="300" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#2B2118">0</text>
  <text x="300" y="166" text-anchor="middle" font-size="15" fill="#5A4E43">animations in the file</text>

  <rect x="450" y="90" width="240" height="112" rx="10" fill="#FFFFFF" stroke="#C8842B" stroke-width="2"/>
  <text x="570" y="130" text-anchor="middle" font-size="28" font-weight="700" fill="#2B2118">1 per action</text>
  <text x="570" y="160" text-anchor="middle" font-size="15" fill="#5A4E43">named after the action</text>
  <text x="570" y="184" text-anchor="middle" font-size="15" fill="#2B2118">bone error 0</text>

  <!-- case 2 -->
  <text x="8" y="252" font-size="16" font-weight="600" fill="#2B2118">NLA clips, FBX</text>
  <text x="8" y="276" font-size="14" fill="#5A4E43">Idle and Reach</text>
  <text x="8" y="296" font-size="14" fill="#5A4E43">stashed on the</text>
  <text x="8" y="316" font-size="14" fill="#5A4E43">NLA, with IK</text>

  <rect x="180" y="226" width="240" height="136" rx="10" fill="#FFFFFF" stroke="#E6DED3"/>
  <text x="300" y="262" text-anchor="middle" font-size="28" font-weight="700" fill="#2B2118">4 takes</text>
  <text x="300" y="290" text-anchor="middle" font-size="15" fill="#5A4E43">for 2 clips</text>
  <text x="300" y="316" text-anchor="middle" font-size="15" fill="#2B2118">two of them wrong:</text>
  <text x="300" y="340" text-anchor="middle" font-size="15" fill="#2B2118">0.60 m, 0.82 rad off</text>

  <rect x="450" y="226" width="240" height="136" rx="10" fill="#FFFFFF" stroke="#C8842B" stroke-width="2"/>
  <text x="570" y="262" text-anchor="middle" font-size="28" font-weight="700" fill="#2B2118">2 takes</text>
  <text x="570" y="290" text-anchor="middle" font-size="15" fill="#5A4E43">Idle and Reach</text>
  <text x="570" y="316" text-anchor="middle" font-size="15" fill="#2B2118">both exact</text>
  <text x="570" y="340" text-anchor="middle" font-size="15" fill="#2B2118">error about 3e-7</text>

  <text x="360" y="404" text-anchor="middle" font-size="14" fill="#5A4E43">Round-trip tolerance 1 mm and 0.001 rad; numbers from our automated test suite.</text>
  <text x="360" y="428" text-anchor="middle" font-size="14" fill="#5A4E43">For a single rig with IK and drivers, plain export is already correct.</text>
</svg>
