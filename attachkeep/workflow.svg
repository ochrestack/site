<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>How Attachkeep works: scan, review, then preview, dry run and the space trash</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5E52"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#FAF7F2"/>

  <!-- Step 1: scan -->
  <rect x="8" y="40" width="208" height="200" rx="12" fill="#FFFFFF" stroke="#E6DED3"/>
  <text x="112" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2118">Your whole site</text>
  <text x="112" y="108" text-anchor="middle" font-size="15" fill="#5A4E43">every attachment</text>
  <text x="112" y="132" text-anchor="middle" font-size="15" fill="#5A4E43">pages, blog posts,</text>
  <text x="112" y="156" text-anchor="middle" font-size="15" fill="#5A4E43">comments and replies</text>
  <text x="112" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">1. Scan the site</text>

  <line x1="220" y1="140" x2="250" y2="140" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: review -->
  <rect x="254" y="40" width="208" height="200" rx="12" fill="#2B2118"/>
  <text x="358" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#FAF7F2">A reason on every file</text>
  <text x="358" y="108" text-anchor="middle" font-size="15" fill="#E6DED3">In use, and where from</text>
  <text x="358" y="132" text-anchor="middle" font-size="15" fill="#E6DED3">or: nothing on the site</text>
  <text x="358" y="156" text-anchor="middle" font-size="15" fill="#E6DED3">refers to it</text>
  <text x="358" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#F2C98E">2. Filter and select</text>

  <line x1="466" y1="140" x2="496" y2="140" stroke="#6B5E52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: delete safely -->
  <rect x="500" y="40" width="212" height="200" rx="12" fill="#FFFFFF" stroke="#C8842B" stroke-width="2"/>
  <text x="606" y="74" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2118">Into the space trash</text>
  <g font-size="15" fill="#2B2118">
    <rect x="512" y="92" width="72" height="28" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="548" y="111" text-anchor="middle">Preview</text>
    <rect x="589" y="92" width="34" height="28" rx="6" fill="none" stroke="none"/><text x="606" y="111" text-anchor="middle" fill="#6B5E52">→</text>
    <rect x="628" y="92" width="72" height="28" rx="6" fill="#FAF7F2" stroke="#E6DED3"/><text x="664" y="111" text-anchor="middle">Dry run</text>
  </g>
  <text x="606" y="148" text-anchor="middle" font-size="15" fill="#5A4E43">restorable, never purged</text>
  <text x="606" y="172" text-anchor="middle" font-size="15" fill="#5A4E43">each failure with its reason</text>
  <text x="606" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#7A4E14">3. Delete for real</text>

  <text x="360" y="284" text-anchor="middle" font-size="15" fill="#5A4E43">One page in Confluence settings, for Confluence administrators.</text>
  <text x="360" y="306" text-anchor="middle" font-size="15" fill="#5A4E43">Every scan, dry run and delete run is kept in the Activity tab.</text>
</svg>
